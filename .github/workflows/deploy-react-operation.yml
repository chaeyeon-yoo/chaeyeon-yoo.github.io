name: Deploy react-operation

on:
  push:
    branches: [main]
    paths:
      - 'react-operation/**'
      - '.github/workflows/deploy-react-operation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-operation/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react-operation

      - name: Build
        run: npm run build
        working-directory: react-operation

      - name: Copy build output to /operation-react
        run: |
          rm -rf operation-react
          mkdir -p operation-react
          cp -r react-operation/dist/. operation-react/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add operation-react
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "chore: react-operation 빌드 결과물 자동 배포"
            git push
          fi
