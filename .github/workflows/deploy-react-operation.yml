name: Deploy react-operation

on:
  push:
    branches: [main]
    paths:
      - 'react-operation/**'
      - '.github/workflows/deploy-react-operation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-operation/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react-operation

      - name: Build
        run: npm run build
        working-directory: react-operation

      - name: Publish to main:/operation-react
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: react-operation/dist
          destination_dir: operation-react
          publish_branch: main
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
